<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>场景对话</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
</head>
<body>
  <header id="top">
    <div class="brand">场景对话</div>
    <button id="btn-scenes" class="pill sc-btn" type="button" aria-pressed="false" title="场景列表：每个场景有自己的程序、聊天和撤销（自动保存）">☰ <span class="sc-cur">新场景</span></button>
    <ol id="steps">
      <li data-step="1" title="一句话说你要什么">说</li>
      <li data-step="2" title="三个空间组织不同的概念挑一个">选</li>
      <li data-step="3" title="在图上拖、画、圈，右边的场景树里改">改</li>
      <li data-step="4" title="导出给引擎，搭完读回对比">出</li>
    </ol>
    <div class="spacer"></div>
    <button id="btn-memory" class="pill" type="button" title="跨场景的偏好">记忆 <i></i></button>
    <button id="ai-status" class="pill" type="button" title="AI 设置">AI：…</button>
  </header>

  <main>
    <aside id="scenes" hidden></aside>
    <section id="chat">
      <div id="log" aria-live="polite"></div>
      <div id="refs" hidden title="加到对话的东西：发送时一起告诉 AI（名字 + 事实）"></div>
      <form id="composer">
        <div id="at-list" role="listbox" hidden></div>
        <input id="input" type="text" placeholder="说一句，比如「我要生成魔法学院」「海盗港口，地下有溶洞」" autocomplete="off" />
        <button type="submit" id="send" title="发送会调用一次 AI"><span id="send-label">发送</span><span class="ai-tag">调 AI</span></button>
      </form>
    </section>

    <section id="stage">
      <div id="tabs">
        <button type="button" class="tab active" data-view="map" title="俯视图 (1)">俯视</button>
        <button type="button" class="tab" data-view="profile" title="剖面 (2)">剖面</button>
        <button type="button" class="tab" data-view="eye" title="从入口看的第一眼 (3)">第一眼</button>
        <button type="button" class="tab" data-view="three" title="3D 预览 (4)">3D</button>
        <div class="spacer"></div>
        <button type="button" id="btn-variants" class="ubtn" disabled title="再出三个新的空间概念；场景树里锁住的项三张都保留">换一批<span class="ai-tag">调 AI</span></button>
        <button type="button" id="btn-export" class="ubtn primary" disabled title="导出引擎包，随时可点">出 →</button>
      </div>
      <div id="toolbar" class="disabled">
        <button type="button" data-tool="move" class="tool active" title="拖形体 / 组 / 地形块 / 空间 / 出生点 = 改它的偏移；按住 Alt 拖重复里的一个 = 只挪这一个；点一下看它是什么 (V)">移动</button>
        <button type="button" data-tool="path" class="tool" title="画一笔 → 加到对话（手绘线），或直接连成一条路（两头吸到最近的东西） (P)">画路</button>
        <button type="button" data-tool="region" class="tool" title="圈一块 = 加到对话，再说这块要做成什么；在地下 / 天上层圈 = 新建空间 (R)">圈区域</button>
        <button type="button" data-tool="height" class="tool" title="在地面任意一点按下上下拖 = 抬高 / 压低；滚轮或 [ ] 调半径，Shift 削平，Alt 只压低 (H)">高度</button>
        <button type="button" data-tool="section" class="tool" title="在图上拉一条剖切线 (S)">剖切</button>
        <button type="button" data-tool="erase" class="tool" title="点掉一个节点 / 地形块 / 连接；点重复里的一个 = 只去掉这一个 (E)">擦除</button>
        <span class="sep"></span>
        <button type="button" id="btn-undo" class="tool" disabled title="撤销 (Ctrl+Z)">↶ 撤销</button>
        <button type="button" id="btn-redo" class="tool" disabled title="重做 (Ctrl+Shift+Z / Ctrl+Y)">↷ 重做</button>
        <div class="spacer"></div>
        <button type="button" id="btn-inset" class="tool" aria-pressed="false" title="俯视图 / 剖面里的 3D 小窗">3D 小窗</button>
      </div>
      <div id="views">
        <div id="view-map" class="view active"></div>
        <div id="view-profile" class="view"></div>
        <div id="view-eye" class="view"></div>
        <div id="view-three" class="view"></div>
        <div id="strata-switch" hidden>
          <button type="button" data-stratum="sky" title="天上的平台 / 栈道 / 平台群">天上<i></i></button>
          <button type="button" data-stratum="ground" class="on" title="地面">地面<i></i></button>
          <button type="button" data-stratum="underground" title="地下的迷宫 / 矿道 / 厅堂 / 洞穴 / 地宫">地下<i></i></button>
          <div id="level-switch" hidden title="空间的内部层：实画当前层，其它层淡画"></div>
        </div>
        <div id="inset3d" hidden>
          <div class="inset-bar" title="拖这条挪位置"><span class="inset-title">3D</span><button type="button" class="inset-min" title="收起">—</button><button type="button" class="inset-x" title="关掉">×</button></div>
          <div class="inset-body"></div>
        </div>
        <div id="popup" hidden></div>
        <div id="note" class="note-bar" hidden></div>
      </div>
      <aside id="side" class="empty">
        <div id="side-empty" class="hint">挑一个概念后，这里是它的场景程序：地形操作、节点树（组 → 子节点，重复 →「× 6 · 环形」），每项都有自己的旋钮。</div>
        <section class="panel" id="p-sel" hidden>
          <h3>选中</h3>
          <div id="selection"></div>
        </section>
        <section class="panel" id="p-comp">
          <h3 title="AI 写的场景程序：点一项看旋钮、图上高亮它生成的整组东西；点图上的东西 = 这里展开对应的项。全部本地改，可撤销。">构成 · 场景树</h3>
          <div id="comp"></div>
        </section>
        <section class="panel" id="p-checks">
          <h3 title="引擎按几何算出来的 ✓ / ✗（看得见、走得到、不压、不悬空、关系），每条带原因和修法">检查 <span class="count"></span></h3>
          <ul id="checks"></ul>
        </section>
      </aside>
    </section>
  </main>

  <div id="modal" hidden><div class="modal-card" id="modal-card"></div></div>

  <dialog id="settings">
    <form method="dialog" id="settings-form">
      <h3>AI 设置</h3>
      <p class="hint">密钥只存在本机 <code>%LOCALAPPDATA%\ai-scene-bridge\config.json</code>，由本地 Python 服务代为调用，网页拿不到明文。没有密钥时用模拟 AI，不花钱，流程照样能走。只有说话、重出、换一批会调 AI（说一句 = 构思 1 次 + 展开 3 次）。</p>
      <div id="s-prov" class="row" role="group" aria-label="服务商"><span>服务商</span><button type="button" class="ubtn" data-p="deepseek" aria-pressed="true">DeepSeek</button><button type="button" class="ubtn" data-p="anthropic" aria-pressed="false">Claude</button></div>
      <label class="row"><span id="s-key-label">DeepSeek API Key</span> <input id="s-key" type="password" placeholder="sk-…" autocomplete="off" /><button type="button" id="s-show" class="ubtn" title="只切换输入框的显示方式">显示</button></label>
      <div id="s-key-hint" class="hint"></div>
      <label class="row"><span>模型</span> <input id="s-model" type="text" list="s-models" value="deepseek-flash" /><datalist id="s-models"></datalist></label>
      <label class="row" id="s-think-row"><input id="s-think" type="checkbox" /> 深度思考（更慢、更贵；默认关）</label>
      <label class="row"><input id="s-mock" type="checkbox" /> 强制使用模拟 AI（没有密钥时自动模拟）</label>
      <div class="actions">
        <button type="button" id="s-test" class="ubtn">测试密钥</button>
        <button type="button" id="s-clear" class="ubtn">清除密钥</button>
        <span id="s-test-result" class="hint"></span>
        <span class="spacer"></span>
        <button type="button" id="s-cancel" class="ubtn">取消</button>
        <button type="submit" id="s-save" class="ubtn primary">保存</button>
      </div>
    </form>
  </dialog>

  <script>/* 脚本出错时在页面底部显示一行（模块加载失败也能看见） */
    addEventListener("error", (e) => { if (!e.message) return; const d = document.getElementById("boot-error") || document.body.appendChild(Object.assign(document.createElement("pre"), { id: "boot-error" })); d.textContent += "页面脚本出错：" + (e.message || e.type) + (e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : "") + "\n"; }, true);
    addEventListener("unhandledrejection", (e) => { const d = document.getElementById("boot-error") || document.body.appendChild(Object.assign(document.createElement("pre"), { id: "boot-error" })); d.textContent += "页面脚本出错：" + ((e.reason && e.reason.message) || e.reason) + "\n"; });
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
