<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>场景对话</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
</head>
<body>
  <header id="top">
    <div class="brand">场景对话</div>
    <ol id="steps">
      <li data-step="1" title="一句话说你要什么">说</li>
      <li data-step="2" title="三张方案挑一张">选</li>
      <li data-step="3" title="在图上拖、画、圈，右边点参数">改</li>
      <li data-step="4" title="导出给引擎，搭完读回对比">出</li>
    </ol>
    <div class="spacer"></div>
    <button id="ai-status" class="pill" title="AI 设置">AI：…</button>
  </header>

  <main>
    <section id="chat">
      <div id="log" aria-live="polite"></div>
      <form id="composer">
        <input id="input" type="text" placeholder="说一句，比如「雾里的山寨，寨门在最低处」" autocomplete="off" />
        <button type="submit" id="send" title="发送会调用一次 AI"><span id="send-label">发送</span><span class="ai-tag">调 AI</span></button>
      </form>
    </section>

    <section id="stage">
      <div id="tabs">
        <button class="tab active" data-view="map" title="俯视图 (1)">俯视</button>
        <button class="tab" data-view="profile" title="剖面 (2)">剖面</button>
        <button class="tab" data-view="eye" title="从入口看的第一眼 (3)">第一眼</button>
        <button class="tab" data-view="three" title="3D 预览 (4)">3D</button>
        <div class="spacer"></div>
        <button id="btn-variants" class="ubtn" disabled title="保留锁住的参数，按一条没锁的轴再出三张">换一批<span class="ai-tag">调 AI</span></button>
        <button id="btn-export" class="ubtn primary" disabled title="导出引擎包，随时可点">出 →</button>
      </div>
      <div id="toolbar" class="disabled">
        <button data-tool="move" class="tool active" title="拖动地标、入口、房子、主路折点、剖切线、空间、连接点；点一下看它是什么 (V)">移动</button>
        <button data-tool="path" class="tool" title="在图上画一笔，这就是主路 (P)">画路</button>
        <button data-tool="region" class="tool" title="圈一块地；在地下 / 天上层圈 = 新建空间 (R)">圈区域</button>
        <button data-tool="section" class="tool" title="在图上拉一条剖切线 (S)">剖切</button>
        <button data-tool="erase" class="tool" title="点掉房子、你圈的地、你画的路、空间 (E)">擦除</button>
        <span class="sep"></span>
        <button id="btn-undo" class="tool" disabled title="撤销 (Ctrl+Z)">↶ 撤销</button>
        <button id="btn-redo" class="tool" disabled title="重做 (Ctrl+Shift+Z / Ctrl+Y)">↷ 重做</button>
        <div class="spacer"></div>
        <button id="btn-inset" class="tool" aria-pressed="false" title="俯视图 / 剖面右下角的 3D 小窗">3D 小窗</button>
      </div>
      <div id="views">
        <div id="view-map" class="view active"></div>
        <div id="view-profile" class="view"></div>
        <div id="view-eye" class="view"></div>
        <div id="view-three" class="view"></div>
        <div id="strata-switch" hidden>
          <button type="button" data-stratum="sky" title="天上的平台 / 栈道 / 浮岛 / 天桥">天上<i></i></button>
          <button type="button" data-stratum="ground" class="on" title="地面">地面<i></i></button>
          <button type="button" data-stratum="underground" title="地下的溶洞 / 地道 / 地窖 / 地宫">地下<i></i></button>
        </div>
        <div id="inset3d" hidden>
          <div class="inset-bar" title="拖这条挪位置"><span class="inset-title">3D</span><button type="button" class="inset-min" title="收起">—</button><button type="button" class="inset-x" title="关掉">×</button></div>
          <div class="inset-body"></div>
        </div>
        <div id="popup" hidden></div>
        <div id="note" class="note-bar" hidden></div>
      </div>
      <aside id="side" class="empty">
        <div id="side-empty" class="hint">挑一张方案后，这里是：参数、空间层、选中的东西、关系检查、色板。</div>
        <section class="panel" id="p-params">
          <h3 title="AI 的理解摘要 + 每个结构参数。点了立刻本地重算；锁住的「换一批」和 AI 都不改。">参数</h3>
          <div id="params"></div>
        </section>
        <section class="panel" id="p-strata">
          <h3 title="地面之外的地下 / 天上空间，和接它们的连接点">空间层</h3>
          <div id="strata"></div>
        </section>
        <section class="panel" id="p-sel" hidden>
          <h3>选中</h3>
          <div id="selection"></div>
        </section>
        <section class="panel" id="p-relations">
          <h3 title="程序按几何算出来的 ✓ / ✗，每条带原因和修法">关系检查</h3>
          <ul id="relations"></ul>
        </section>
        <section class="panel" id="p-palette">
          <h3 title="给一张参考图取色，或从风格板里挑">色板</h3>
          <div id="reference"></div>
          <div id="palette"></div>
        </section>
      </aside>
    </section>
  </main>

  <div id="modal" hidden><div class="modal-card" id="modal-card"></div></div>

  <dialog id="settings">
    <form method="dialog" id="settings-form">
      <h3>AI 设置</h3>
      <p class="hint">密钥只存在本机 <code>%LOCALAPPDATA%\ai-scene-bridge\config.json</code>，由本地 Python 服务代为调用，网页拿不到明文。没有密钥时用模拟 AI，不花钱，流程照样能走。只有说话、重出、换一批会调 AI。</p>
      <label class="row"><span>Anthropic API Key</span> <input id="s-key" type="password" placeholder="sk-ant-…" autocomplete="off" /><button type="button" id="s-show" class="ubtn" title="只切换输入框的显示方式，密钥不会出现在消息或日志里">显示</button></label>
      <div id="s-key-hint" class="hint"></div>
      <label class="row"><span>模型</span> <input id="s-model" type="text" list="s-models" value="claude-opus-5-5" /><datalist id="s-models"></datalist></label>
      <label class="row"><input id="s-mock" type="checkbox" /> 强制使用模拟 AI（没有密钥时自动模拟）</label>
      <div class="actions">
        <button type="button" id="s-test" class="ubtn">测试密钥</button>
        <button type="button" id="s-clear" class="ubtn">清除密钥</button>
        <span id="s-test-result" class="hint"></span>
        <span class="spacer"></span>
        <button type="button" id="s-cancel" class="ubtn">取消</button>
        <button type="submit" id="s-save" class="ubtn primary">保存</button>
      </div>
    </form>
  </dialog>

  <script>/* 脚本出错时在页面底部显示一行（模块加载失败也能看见） */
    addEventListener("error", (e) => { if (!e.message) return; const d = document.getElementById("boot-error") || document.body.appendChild(Object.assign(document.createElement("pre"), { id: "boot-error" })); d.textContent += "页面脚本出错：" + (e.message || e.type) + (e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : "") + "\n"; }, true);
    addEventListener("unhandledrejection", (e) => { const d = document.getElementById("boot-error") || document.body.appendChild(Object.assign(document.createElement("pre"), { id: "boot-error" })); d.textContent += "页面脚本出错：" + ((e.reason && e.reason.message) || e.reason) + "\n"; });
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
