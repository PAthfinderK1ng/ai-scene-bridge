<!doctype html><meta charset="utf-8"><pre id="out">running</pre>
<script type="module">
// scene.js（引擎适配层）的本地操作：删房持久、改空间连接方式、解锁拖过的房子、previewState 临时预览
import { test, run, assert, close } from "./harness.js";
import { Scene } from "../../scene.js";

const CARD = { archetype: "slope_zigzag", params: { terraces: 4, layer_height_m: 3, plateau_width: "medium", entry_side: "S" }, landmark: { kind: "temple", label: "山顶寺", placement: "top" }, spawn: { placement: "valley_bottom" } };
const make = (card = CARD) => new Scene(7).setCard(card);
const gen = (sc) => sc.sid.volumes.filter((v) => v.generated && v.kind === "building");
const near = (sc, p, r = 3) => gen(sc).filter((v) => Math.hypot(v.position[0] - p[0], v.position[2] - p[1]) <= r);
const extra = [];

test("removeVolume：删掉程序生成的房子，重算 / 改参数后那里不再长出来；撤销能恢复", () => {
  const sc = make();
  const before = sc.snapshotState();
  const h = gen(sc)[0], p = [h.position[0], h.position[2]], n0 = gen(sc).length;
  sc.removeVolume(h.id);
  assert(near(sc, p).length === 0 && gen(sc).length === n0 - 1, "删了一栋");
  assert(sc.user.removed.length === 1 && sc.user.removed[0][2] === "building", "记位置不记 id");
  sc.rebuild(); sc.patch({ density_scale: 1 });
  assert(near(sc, p).length === 0, "重算后不回来");
  assert(sc.facts.houses === sc.sid.volumes.filter((v) => v.kind === "building" && v.importance !== "landmark").length, "facts 跟着变");
  assert(JSON.stringify(sc.snapshotState().user.removed) === JSON.stringify(sc.user.removed), "snapshotState 带 removed");
  sc.restoreState(before);
  assert(near(sc, p).length === 1 && !sc.user.removed.length, "撤销后回来");
  // 换原型：位置对不上，作废
  sc.removeVolume(gen(sc)[0].id);
  sc.setCard(Object.assign({}, CARD, { archetype: "ring_terrace" }));
  assert(sc.user.removed.length === 0, "换原型清掉删房记录");
});

test("setSpaceConnect：AI 生成的空间改卡片 levels 的 connect；人加的直接改连接点；重算后都还在", () => {
  const sc = make(Object.assign({}, CARD, { levels: [{ stratum: "underground", kind: "cave", anchor: "landmark", depth_layers: 2, size: "medium", connect: "stairs", label: "寺下溶洞" }] }));
  const sp = sc.sid.spaces.find((s) => s.generated);
  assert(sp && sp.id === "space_cave_1", "有生成的溶洞");
  assert(sc.setSpaceConnect(sp.id, "well") === sc, "返回 scene");
  assert(sc.card.levels[0].connect === "well", "卡片 levels 改了");
  const conn = () => sc.sid.markers.filter((m) => m.kind === "connector" && (m.to === sp.id || m.from === sp.id));
  assert(conn().length === 1 && conn()[0].via === "well", "连接点换成井：" + JSON.stringify(conn().map((m) => m.via)));
  sc.patch({ density_scale: 0.9 });
  assert(conn()[0].via === "well", "重算后仍是井");
  const uid = sc.addSpace({ stratum: "sky", kind: "platform", anchor: "top", size: "small" });
  assert(uid && sc.setSpaceConnect(uid, "ladder") === sc, "人加的空间");
  const uc = () => sc.sid.markers.find((m) => m.kind === "connector" && m.to === uid);
  assert(uc().via === "ladder" && uc().label === "上行梯子", "连接点换成梯子：" + uc().label);
  sc.patch({ density_scale: 1 });
  assert(uc().via === "ladder", "重算后仍是梯子");
  assert(sc.setSpaceConnect(uid, "teleport") === false && sc.setSpaceConnect("nope", "ladder") === false, "不合法 → false");
});

test("lockVolume(id, false)：拖过的房子只解锁，不变回生成、不消失", () => {
  const sc = make();
  const id = sc.moveVolume(gen(sc)[0].id, [gen(sc)[0].position[0] + 1, gen(sc)[0].position[2]]);
  const v = () => sc.sid.volumes.find((x) => x.id === id);
  assert(v() && v().locked && v().user_moved, "拖过：锁住");
  sc.lockVolume(id, false);
  assert(v() && v().locked === false && !v().generated && v().user_moved, "只解锁：" + JSON.stringify(v()));
  sc.rebuild();
  assert(v(), "重算后还在");
  // 没拖过的锁住再解锁：交回程序排
  const g = gen(sc)[1].id;
  sc.lockVolume(g, true); assert(sc.sid.volumes.find((x) => x.id === g).locked, "锁住");
  sc.lockVolume(g, false); assert(!sc.sid.volumes.some((x) => x.id === g && !x.generated), "交回程序排");
});

test("previewState：返回改过的临时 Scene，本体不变；mutator 里的多次 rebuild 合并成一次；记耗时", () => {
  const sc = make();
  const snap = JSON.stringify(sc.snapshotState());
  const h = gen(sc)[2];
  const pv = sc.previewState((s) => { s.setLandmarkHeight(20); s.setTerraceHeight("terrace_1", 5); });
  assert(pv !== sc && pv instanceof Scene, "新对象");
  assert(pv.landmark().size[1] === 20 && pv.sid.terrain.features.find((f) => f.id === "terrace_1").height === 5, "副本改了");
  assert(JSON.stringify(sc.snapshotState()) === snap, "本体没变");
  assert(typeof pv.rebuild === "function" && pv.rebuild === Scene.prototype.rebuild, "rebuild 恢复");
  let calls = 0;
  const orig = Scene.prototype.rebuild;
  Scene.prototype.rebuild = function () { calls++; return orig.call(this); };
  try { sc.previewState((s) => { s.setLandmarkHeight(12); s.setLandmarkHeight(14); s.moveVolume(h.id, [h.position[0] + 2, h.position[2]]); }); } finally { Scene.prototype.rebuild = orig; }
  assert(calls === 1, "只 rebuild 一次：" + calls);
  // 计时：villageSid 规模（之字坡 4 层、中宽）拖一栋房子
  const ts = [];
  for (let i = 0; i < 10; i++) { const t0 = performance.now(); sc.previewState((s) => s.moveVolume(h.id, [h.position[0] + (i % 3), h.position[2]])); ts.push(performance.now() - t0); }
  ts.sort((a, b) => a - b);
  extra.push(`DATA previewState 中位 ${ts[5].toFixed(1)} ms，最快 ${ts[0].toFixed(1)} ms，最慢 ${ts[9].toFixed(1)} ms；房 ${pv.facts.houses} 栋`);
  assert(ts[5] < 400, "单次 < 400 ms：" + ts[5]);
  // 大场景：溪谷 7 层（两岸 14 块台地 + 溪）
  const big = make({ archetype: "valley_two_banks", params: { terraces: 7, plateau_width: "wide", stream: true }, landmark: { kind: "wheel", placement: "ridge_end" } });
  const bh = gen(big)[0], tb = [];
  for (let i = 0; i < 5; i++) { const t0 = performance.now(); big.previewState((s) => s.moveVolume(bh.id, [bh.position[0], bh.position[2] + (i % 2)])); tb.push(performance.now() - t0); }
  tb.sort((a, b) => a - b);
  extra.push(`DATA previewState 溪谷 7 层 中位 ${tb[2].toFixed(1)} ms；房 ${big.facts.houses} 栋`);
});

await run();
document.getElementById("out").textContent = extra.join("\n") + "\n" + document.getElementById("out").textContent;
</script>
