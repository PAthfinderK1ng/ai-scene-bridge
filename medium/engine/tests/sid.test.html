<!doctype html><meta charset="utf-8"><pre id="out">running</pre>
<script type="module">
import { test, run, assert, close, between } from "./harness.js";
import { pointInPolygon, polygonCentroid } from "../terrain.js";
import { newDoc, resolve, snapshot, restore, THEME, setTerraceHeight, resetTerraceHeight, landVolumes } from "../sid.js";
import { compilePlan } from "../plan.js";
import { villageSid, valleySid } from "./fixtures.js";

const EX = {};
for (const n of ["mountain-village", "mine-maze", "sky-garden"]) EX[n] = await fetch(`../../../spec/examples/plans/${n}.plan.json`, { cache: "no-store" }).then((r) => r.json());
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const xz = (p) => [p[0], p[2]];
const housesOf = (sid) => sid.volumes.filter((v) => v.kind === "building" && v.generated);
const checkOf = (checks, id) => checks.find((c) => c.id === id);
const build = (seed = 1, n = "mountain-village") => compilePlan(EX[n], { seed });
/** 平地上一块陡崖台（没有路上去）+ 一座塔：自动支路要补到崖顶 */
const cliffPlan = () => ({ name: "崖台", site: { size_m: [140, 140], ground: "flat" }, terrain: [{ id: "mesa", op: "cliff", at: "site.N", shape: "rect", size_m: [50, 30], height_m: 9 }], nodes: [{ id: "keep", type: "tower", role: "landmark", at: "site.C", size_m: [8, 14] }], spawn: { at: "site.S", look_at: "keep" } });

test("newDoc：含主题默认调色板、bounds、层高、玩家高度；THEME 有路 / 溪默认值", () => {
  const sid = newDoc();
  assert(sid.sid_version === "0.1" && sid.meta.layer_height_m === 3 && sid.meta.player_height === 1.7, "meta 默认值");
  assert(sid.style.palette.length === 5 && sid.style.palette.map((p) => p.role).join() === "roof,wall,stone,foliage,mist", "五个角色");
  assert(sid.bounds.min[0] === -60 && sid.bounds.max[2] === 60, "默认 bounds");
  assert(THEME.mountain_village.trail.width === 2 && THEME.mountain_village.stream.width === 4 && THEME.mountain_village.house_sizes.width[0] === 5, "主题默认值");
  assert(!("landmarks" in THEME.mountain_village), "地标词表随 Card 一起去掉了（地标由 plan 给）");
});

test("旧模式：resolve 直接跑 fixtures（villageSid / valleySid），出主路、房子贴地且不重叠、7 个 check", () => {
  for (const mk of [villageSid, valleySid]) {
    const { sid, checks, T } = resolve(mk(), { seed: 5 });
    const hs = housesOf(sid);
    assert(hs.length >= 10, mk.name + " 房子数 " + hs.length);
    for (const h of hs) close(h.position[1], T.heightAt(h.position[0], h.position[2]), 0.02, h.id + " 贴地");
    assert(checkOf(checks, "houses_no_overlap").ok, mk.name + " 不重叠");
    assert(sid.paths.some((p) => p.id === "main_trail"), mk.name + " 有主路");
    assert(checks.length === 7, "7 个 check");
  }
});

test("plan v2：resolve 保留编译的主路与形体（按 land 规则重新落地，不按旧规则重算），只重放房子；跳过「地标在顶层」检查", () => {
  const r = build(1), sid = r.sid;
  assert(sid.meta.plan_mode && sid.meta.plan_version === 2, "plan_version 2");
  const trail = JSON.stringify(sid.paths.find((p) => p.id === "main_trail").points), pos = JSON.stringify(sid.volumes.filter((v) => v.land).map((v) => [v.id, v.position, v.rotation_y]));
  sid.volumes = sid.volumes.filter((v) => !v.generated);
  const again = resolve(sid, { seed: 1 });
  assert(JSON.stringify(sid.paths.find((p) => p.id === "main_trail").points) === trail, "主路不动");
  assert(JSON.stringify(sid.volumes.filter((v) => v.land).map((v) => [v.id, v.position, v.rotation_y])) === pos, "形体不动");
  assert(housesOf(sid).length === r.facts.houses, "房子按同 seed 重放");
  assert(!checkOf(again.checks, "landmark_on_top"), "plan 模式没有 landmark_on_top");
  assert(checkOf(again.checks, "trail_reaches_landmark").text.includes("鼓楼"), "主路检查看主路自己的终点：" + checkOf(again.checks, "trail_reaches_landmark").text);
});

test("plan v2：landVolumes 按 land 重新落地——立在别人顶上的跟着它，贴地的离地 < 1 m", () => {
  const r = build(1, "sky-garden"), sid = r.sid, T = r.T;
  const hub = sid.volumes.find((v) => v.id === "hub"), pav = sid.volumes.find((v) => v.id === "pavilion");
  close(pav.position[1], hub.position[1] + hub.size[1], 0.02, "亭立在岛顶");
  hub.land = { mode: "abs", abs: hub.position[1] + 5 };
  landVolumes(sid, T);
  close(pav.position[1], hub.position[1] + hub.size[1], 0.02, "岛抬高后亭子跟着");
  const m = build(1, "mine-maze").sid;
  const shed = m.volumes.find((v) => v.id === "sheds_0");
  assert(shed.land.mode === "snap" && shed.elev < 1, "工棚贴地 " + JSON.stringify(shed.land) + " " + shed.elev);
});

test("snapshot / restore 往返相等，且丢掉 _ 开头的临时字段", () => {
  const { sid } = build(3);
  sid._tmp = { x: 1 };
  const s1 = snapshot(sid);
  const back = restore(s1);
  assert(!("_tmp" in back), "丢掉 _tmp");
  assert(snapshot(back) === s1, "往返相等");
  assert(snapshot(restore(JSON.parse(s1))) === s1, "也接受已解析对象");
  const r = restore("{}");
  assert(Array.isArray(r.volumes) && Array.isArray(r.terrain.features), "缺失集合补齐");
});

test("确定性：同 (plan, seed) 两次逐字节相同；不同 seed 房子不同、地形相同；重复 resolve 幂等", () => {
  const a = build(11), b = build(11), c = build(12);
  assert(snapshot(a.sid) === snapshot(b.sid), "sid 相同");
  assert(JSON.stringify(a.checks.map((k) => [k.id, k.ok, k.detail])) === JSON.stringify(b.checks.map((k) => [k.id, k.ok, k.detail])), "checks 相同");
  assert(snapshot(a.sid) !== snapshot(c.sid), "不同 seed 应不同");
  const again = resolve(a.sid, { seed: 11 });
  assert(snapshot(again.sid) === snapshot(b.sid), "重复 resolve 幂等");
});

test("性能：resolve 耗时在返回值顶层 ms，facts 本身逐字节确定", () => {
  const a = build(1), b = build(1);
  assert(typeof a.ms === "number" && a.ms >= 0 && !("ms" in a.facts), "ms 在顶层、不在 facts 里");
  assert(JSON.stringify(a.facts) === JSON.stringify(b.facts), "facts 两次逐字节相同");
  const r = resolve(a.sid, { seed: 1 });
  assert(typeof r.ms === "number" && !("ms" in r.facts), "resolve 的 ms");
});

test("人画的路与人圈的区域在 resolve 后保留；手画林子出树、房子不进林子", () => {
  const { sid } = build(1);
  sid.paths.push({ id: "my_path", kind: "trail", width: 2, points: [[-40, 50], [-40, 30]], surface: "dirt", label: "手画小路", user_drawn: true });
  const c = [-50, 62]; // 山脚西南：不在台地 / 竹林 / 路上
  const poly = [[c[0] - 10, c[1] - 5], [c[0] + 10, c[1] - 5], [c[0] + 10, c[1] + 5], [c[0] - 10, c[1] + 5]];
  sid.regions.push({ id: "my_forest", kind: "forest", polygon: poly, density: 1, label: "我的林子", user_set: true });
  const r = resolve(sid, { seed: 1 });
  assert(r.sid.paths.some((p) => p.id === "my_path") && r.sid.regions.some((g) => g.id === "my_forest"), "保留");
  const trees = r.sid.volumes.filter((v) => v.kind === "prop" && v.region_id === "my_forest");
  assert(trees.length >= 3, "手画林子里出树 " + trees.length);
  for (const h of housesOf(r.sid)) assert(!pointInPolygon(xz(h.position), poly), `${h.id} 进了林子`);
  assert(checkOf(r.checks, "houses_no_overlap").ok, "房与树不重叠");
});

test("自动支路：够不到的台地默认补支路后每层可达；重复 resolve 幂等；autoSpur:false 或标「不重要」则不补", () => {
  const a = compilePlan(cliffPlan(), { seed: 1 });
  assert(a.facts.terraces >= 1, "崖顶登记成台地 " + a.facts.terraces);
  assert(a.facts.spurs.length >= 1, "补了支路 " + a.facts.spurs.length);
  assert(checkOf(a.checks, "terraces_reachable").ok, "补后每层可达：" + checkOf(a.checks, "terraces_reachable").detail);
  const s1 = snapshot(a.sid), again = resolve(a.sid, { seed: 1 });
  assert(snapshot(again.sid) === s1, "重复 resolve 幂等（自动支路先清再补）");
  const b = resolve(restore(s1), { seed: 1, autoSpur: false });
  assert(b.facts.spurs.length === 0 && !b.sid.paths.some((p) => p.auto_spur), "autoSpur:false 不补");
  const c = compilePlan(cliffPlan(), { seed: 1, ignored: ["terraces_reachable"] });
  assert(c.facts.spurs.length === 0 && checkOf(c.checks, "terraces_reachable").ignored === true, "标了不重要就不补");
  for (const p of a.sid.paths.filter((q) => q.auto_spur)) assert(p.id.startsWith("spur_") && p.generated && p.kind === "trail" && p.points.length >= 2, "自动支路结构");
});

test("台地单独调高：吸附 0.5 m、写 user_height，房子贴新高度、人拖过的房子跟着走；恢复回规则高度（层号 × 层高）", () => {
  const { sid } = build(1);
  const f = sid.terrain.features.find((x) => x.plan_id === "steps" && x.step === 2);
  const h0 = f.height;
  setTerraceHeight(sid, f.id, h0 + 1.3);
  assert(f.height === h0 + 1.5 && f.user_height === true, "吸附 " + f.height);
  const r = resolve(sid, { seed: 1 });
  const on = housesOf(sid).filter((h) => h.terrace_id === f.id);
  assert(on.length > 0, "那层还有房");
  for (const h of on) close(h.position[1], h0 + 1.5, 0.3, `${h.id} 贴新高度`);
  assert(r.facts.errors === 0, "无 validate error");
  const h = on[0];
  Object.assign(h, { id: "u_house_1", generated: false, user_moved: true });
  setTerraceHeight(sid, f.id, h0 + 2);
  resolve(sid, { seed: 1 });
  close(sid.volumes.find((v) => v.id === "u_house_1").position[1], h0 + 2, 0.3, "user_moved 房子贴新高度");
  resetTerraceHeight(sid, f.id);
  assert(f.height === f.level * 3 && !("user_height" in f), "恢复规则高度 " + f.height);
});

test("旧模式：主路为躲开人放的房子绕行，trail 事实记 detour_around，检查文案提一句", () => {
  const sid = villageSid(7);
  const T0 = resolve(sid, { seed: 1 }).T, mt = sid.paths.find((p) => p.id === "main_trail");
  const p = mt.points.find((q) => { const t = T0.terraceAt(q[0], q[1]); return t && t.level === 1 && T0.slopeAt(q[0], q[1]) < 0.1; }) || mt.points[Math.floor(mt.points.length / 2)];
  sid.volumes.push({ id: "u_house_1", kind: "building", shape: "box", position: [p[0], 0, p[1]], size: [6, 4, 5], rotation_y: 0, label: "民居", importance: "secondary", color_role: "wall", locked: true, user_moved: true });
  const r = resolve(sid, { seed: 1 });
  assert(r.facts.trail && (r.facts.trail.detour_around || []).includes("u_house_1"), "detour_around：" + JSON.stringify(r.facts.trail));
  const c = checkOf(r.checks, "houses_clear_of_paths");
  assert(c.ok && c.detail.includes("绕"), "不压路且提到绕行：" + c.detail);
});

test("窄带也有房：台地生成器（坡上 / 环台）× 3 / 5 / 7 级 + 撒房子，密度 1 时每张 ≥ 6 栋、住人的每一级 ≥ 1 栋（环台顶上两级除外），房子检查全过", () => {
  for (const form of ["slope", "ring"]) for (const n of [3, 5, 7]) {
    const t = form === "ring" ? { id: "t", type: "terraces", form, at: "site.C", size_m: [104, 104], steps: n, width_m: 8 } : { id: "t", type: "terraces", form, at: "site.C", size_m: [70, n * 11], orient: "N", steps: n };
    const plan = { name: "窄带", site: { size_m: [140, 140], ground: "flat", layer_m: 3 }, nodes: [t, { id: "z", type: "scatter_houses", area: "t", density: 1 }, { id: "lm", type: "building", role: "landmark", at: "t.top", size_m: [10, 9, 9] }], spawn: { at: "site.S", look_at: "lm" } };
    const r = compilePlan(plan, { seed: 7 }), tag = `${form}/${n}`;
    assert(r.facts.houses >= 6, `${tag} 只有 ${r.facts.houses} 栋`);
    const levels = [...new Set(r.sid.regions.filter((g) => g.plan_id === "z").map((g) => g.terrace_level))].sort((a, b) => a - b);
    for (const lv of levels.slice(0, form === "ring" ? Math.max(1, levels.length - 2) : levels.length)) assert((r.facts.perTerrace[lv] || 0) >= 1, `${tag} 第 ${lv} 层没房：${JSON.stringify(r.facts.perTerrace)}`);
    for (const id of ["houses_on_terraces", "houses_clear_of_paths", "houses_no_overlap"]) assert(checkOf(r.checks, id).ok, `${tag} ${id}：${checkOf(r.checks, id).detail}`);
  }
});

test("facts：forms 按形制计数、bridges（路过河处）、spaces（interior.spaceFacts 的对象形状）", () => {
  const v = build(1);
  assert(v.facts.forms.house === v.facts.houses && v.facts.houses > 0, "民居计数 " + JSON.stringify(v.facts.forms));
  const plan = { name: "过河", site: { size_m: [140, 140], ground: "flat" }, terrain: [{ id: "river", op: "river", from: "site.W", to: "site.E", width_m: 8, depth_m: 2 }], nodes: [{ id: "keep", type: "tower", role: "landmark", at: "site.N", size_m: [6, 12] }], spawn: { at: "site.S", look_at: "keep" } };
  const r = compilePlan(plan, { seed: 1 });
  assert(r.facts.bridges.length >= 1 && r.facts.bridges.every((b) => b.at.length === 2 && b.dir.length === 2), "路过河 = 桥：" + JSON.stringify(r.facts.bridges));
  const sf = v.facts.spaces;
  assert(!Array.isArray(sf) && sf.total === 0 && Array.isArray(sf.items), "spaces 是 interior.spaceFacts 的对象");
  assert(build(1, "mine-maze").facts.spaces.total === 1, "矿洞一个空间");
});

run();
</script>
