<!doctype html><meta charset="utf-8"><pre id="out">running</pre>
<script type="module">
// plan.test.html — 场景程序（plan v2，docs/06）解释器：示例、展开、锚点、落地、避让、连接、雕刻、生成器、ops、拖动反算、旋钮、差异、性能。
import { test, run, assert, close, between } from "./harness.js";
import { pointInPolygon, distToPolyline } from "../terrain.js";
import { boxCorners } from "../layout.js";
import { obbOverlap } from "../validate.js";
import { resolve, snapshot } from "../sid.js";
import { sampleSection } from "../section.js";
import { PLAN_SCHEMA, PLAN_GROUPS, canonRef, normalizePlan, compilePlan, applyOps, resolveTarget, atFromPoint, offsetFromPoint, expand, knobsFor, summarize, newElement, planDistance, distinctPlans, findNode } from "../plan.js";

const NAMES = ["magic-academy", "sky-garden", "pirate-harbor", "desert-temple", "cyber-market", "mountain-village", "mine-maze"];
const EX = {};
for (const n of NAMES) EX[n] = await fetch(`../../../spec/examples/plans/${n}.plan.json`, { cache: "no-store" }).then((r) => r.json());
const C = {};
const comp = (n) => (C[n] = C[n] || compilePlan(EX[n], { seed: 1 }));
const xz = (p) => [p[0], p[2]];
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const chk = (r, id) => r.checks.find((c) => c.id === id);
const vol = (r, id) => r.sid.volumes.find((v) => v.id === id);
const vols = (r, pid) => r.sid.volumes.filter((v) => v.plan_id === pid || (v.plan_path || []).includes(pid));
const foot = (v) => boxCorners(v.position, v.size, v.rotation_y || 0);
const facing = (v) => { const t = (v.rotation_y * Math.PI) / 180; return [-Math.sin(t), -Math.cos(t)]; };
const errs = (r) => r.facts.validation.filter((m) => m.level === "error");
/** 最小 plan：平地 140 m 见方 + 给的节点 */
const mini = (nodes, extra = {}) => Object.assign({ name: "测试", site: { size_m: [140, 140], ground: "flat", layer_m: 3 }, nodes, spawn: { at: "site.S" } }, extra);
const walkSchema = (s, f, seen = new Set()) => { if (!s || typeof s !== "object" || seen.has(s)) return; seen.add(s); f(s); for (const v of Object.values(s)) walkSchema(v, f, seen); };

// ============================================================ schema 与示例
test("schema v2：分组 terrain / nodes / relations / look；每种 op / type 都有 x-defaults 与 x-size；schema 里没有全局坐标字段", () => {
  assert(PLAN_SCHEMA["x-version"] === 2, "x-version 2");
  assert(PLAN_GROUPS.map((g) => g.key).join() === "terrain,nodes,relations,look", "分组 " + PLAN_GROUPS.map((g) => g.key));
  const D = PLAN_SCHEMA.definitions, XD = PLAN_SCHEMA["x-defaults"];
  for (const op of D.terrain_op.properties.op.enum) assert(XD.terrain[op], "x-defaults.terrain." + op);
  for (const t of D.node.properties.type.enum) { assert(XD.nodes[t], "x-defaults.nodes." + t); assert(Array.isArray(PLAN_SCHEMA["x-size"][t]), "x-size." + t); }
  const cls = PLAN_SCHEMA["x-node-classes"].flatMap((c) => c.types);
  assert(cls.length === D.node.properties.type.enum.length && D.node.properties.type.enum.every((t) => cls.includes(t)), "x-node-classes 覆盖全部类型");
  const bad = ["position", "x", "z", "points", "polygon", "center", "coords", "floor_y", "top_y"];
  walkSchema(PLAN_SCHEMA, (s) => { if (s.properties) for (const k of Object.keys(s.properties)) assert(!bad.includes(k), "schema 有坐标字段 " + k); });
  assert(D.ops && D.op_set && D.op_add && D.op_remove && D.revise, "ops 定义");
});

test("7 个示例都能编译：validate 0 error、SID id 唯一、plan_version 2、检查全部通过（形体不重叠 / 不悬空 / 走得到 / 关系）", () => {
  for (const n of NAMES) {
    const r = comp(n);
    assert(errs(r).length === 0, `${n} validate error：${errs(r).map((e) => e.msg).join("；")}`);
    const ids = [...r.sid.terrain.features, ...r.sid.volumes, ...r.sid.regions, ...r.sid.paths, ...r.sid.markers, ...r.sid.spaces].map((o) => o.id);
    assert(new Set(ids).size === ids.length, `${n} id 重复`);
    assert(r.sid.meta.plan_version === 2 && r.sid.meta.plan.name === EX[n].name, n + " meta");
    const bad = r.checks.filter((c) => !c.ok && !c.ignored);
    assert(bad.length === 0, `${n} 检查没过：${bad.map((c) => c.text + "：" + c.detail).join("；")}`);
    assert(r.sid.markers.some((m) => m.kind === "player_spawn"), n + " 出生点");
  }
});

test("示例的空间组织各不相同：魔法学院不是台地 + 撒房子；只有山城用台地生成器；7 个示例两两 planDistance ≥ 1", () => {
  const gens = (p) => expand(p).map((e) => e.type);
  assert(!gens(EX["magic-academy"]).includes("terraces") && !gens(EX["magic-academy"]).includes("scatter_houses"), "学院没有台地 / 撒房子");
  for (const n of NAMES) if (n !== "mountain-village") assert(!gens(EX[n]).includes("terraces"), n + " 不该用台地生成器");
  assert(gens(EX["mountain-village"]).includes("terraces") && gens(EX["mountain-village"]).includes("scatter_houses"), "山城用台地 + 撒房子");
  for (let i = 0; i < NAMES.length; i++) for (let j = i + 1; j < NAMES.length; j++) { const d = planDistance(EX[NAMES[i]], EX[NAMES[j]]); assert(d >= 1, `${NAMES[i]} vs ${NAMES[j]} 只差 ${d}`); }
  assert(planDistance(EX["sky-garden"], EX["sky-garden"]) === 0 && distinctPlans([EX["magic-academy"], EX["sky-garden"], EX["pirate-harbor"]]), "自己与自己 0，三张够不同");
});

test("确定性：同 plan + seed 两次逐字节相同；换 seed 只有散布 / 布房变，形体不变", () => {
  for (const n of ["magic-academy", "pirate-harbor"]) {
    const a = compilePlan(EX[n], { seed: 5 }), b = compilePlan(EX[n], { seed: 5 }), c = compilePlan(EX[n], { seed: 6 });
    assert(snapshot(a.sid) === snapshot(b.sid), n + " sid 相同");
    assert(JSON.stringify(a.checks.map((k) => [k.id, k.ok, k.detail])) === JSON.stringify(b.checks.map((k) => [k.id, k.ok, k.detail])), n + " checks 相同");
    assert(JSON.stringify(a.index) === JSON.stringify(b.index) && JSON.stringify(a.facts) === JSON.stringify(b.facts), n + " index / facts 相同");
    const fixed = (r) => JSON.stringify(r.sid.volumes.filter((v) => v.land && !v.instance_of).map((v) => [v.id, v.position]));
    assert(fixed(a) === fixed(c), n + " 非散布的形体不随 seed 变");
    assert(snapshot(a.sid) !== snapshot(c.sid), n + " 散布随 seed 变");
  }
});

test("索引：节点 / 组 / 重复 / 实例 id[k] / 地形操作 / spawn 都对得上 SID 对象；SID 的 plan_id 都指回 plan", () => {
  const r = comp("magic-academy");
  for (const id of ["academy", "hall", "towers", "towers[2]", "court", "library", "stacks", "rock", "light_bridge", "vault", "spawn"]) assert(r.index[id] && r.index[id].sid_ids.length, "索引缺 " + id);
  assert(r.index.towers.sid_ids.length === 6 && r.index["towers[2]"].sid_ids.length === 1, "重复 6 个、实例 1 个");
  assert(r.index.academy.sid_ids.includes("hall") && r.index.academy.sid_ids.includes("towers_3") && r.index.academy.group === "nodes", "组收子孙");
  assert(r.index.library.sid_ids.includes("stacks"), "浮岛收岛上的楼");
  assert(r.index.rock.group === "terrain" && r.index.rock.type === "raise", "地形操作的组与类型");
  for (const v of r.sid.volumes) if (v.plan_id) assert(r.index[v.plan_id], `${v.id} 的 plan_id ${v.plan_id} 不在索引里`);
});

// ============================================================ 形体与尺寸
test("每种形体都出体块：shape 对、size 都是 [x, 高, z] 三个数；圆的类直径写两遍；建筑件的 kind / 屋顶 / 边数", () => {
  const SH = ["box", "cylinder", "cone", "dome", "pyramid", "wedge", "arch", "torus", "sphere", "prism"];
  const nodes = SH.map((t, i) => ({ id: "s_" + t, type: t, at: "site.C", offset_m: [((i % 5) - 2) * 22, (Math.floor(i / 5) - 0.5) * 30], size_m: t === "dome" ? [10] : t === "torus" ? [10, 2] : [8, 6, 8] }));
  const parts = [["tower", [6, 20]], ["column", [1, 6]], ["tree", [4, 8]], ["crystal", [2, 6]], ["statue", [2, 4, 2]], ["gate", [6, 7, 2]], ["platform", [10, 1, 10]], ["stairs", [4, 3, 8]]];
  parts.forEach(([t, s], i) => nodes.push({ id: "p_" + t, type: t, at: "site.N", offset_m: [(i - 3.5) * 14, 0], size_m: s }));
  nodes.push({ id: "p_building", type: "building", at: "site.S", offset_m: [-30, -10], size_m: [12, 8, 10], roof: "pyramid" }, { id: "p_prism_tower", type: "tower", shape: "prism", sides: 8, at: "site.S", offset_m: [20, -10], size_m: [8, 18] });
  const r = compilePlan(mini(nodes), { seed: 1 });
  assert(errs(r).length === 0, "validate " + errs(r).map((e) => e.msg));
  for (const t of SH) { const v = vol(r, "s_" + t); assert(v && v.shape === t && v.size.length === 3, "形体 " + t); }
  const cyl = vol(r, "s_cylinder"); assert(cyl.size[0] === 8 && cyl.size[2] === 8 && cyl.size[1] === 6, "圆柱 [8,6,8] " + cyl.size);
  const dome = vol(r, "s_dome"); assert(dome.size[0] === 10 && dome.size[1] === 5, "穹顶只给直径：高 = 半径 " + dome.size);
  assert(vol(r, "s_prism").sides === 6, "棱柱默认 6 边");
  const K = { tower: "cylinder", column: "cylinder", tree: "cone", crystal: "prism", statue: "box", gate: "arch", platform: "box", stairs: "wedge" };
  for (const [t, sh] of Object.entries(K)) { const v = vol(r, "p_" + t); assert(v && v.kind === t && v.shape === sh, `建筑件 ${t}：${v && v.kind}/${v && v.shape}`); }
  const b = vol(r, "p_building"); assert(b.kind === "building" && b.roof === "spire" && b.roof_h > 0 && b.roof_h < b.size[1], "房子屋顶 pyramid → spire " + b.roof);
  const pt = vol(r, "p_prism_tower"); assert(pt.shape === "prism" && pt.sides === 8 && pt.roof === "spire", "塔换成八棱柱");
});

test("院与墙：院出 4 面墙（门那面断开）+ 门 + 院内铺地；沿折线的墙按段出；围着某个节点的墙绕它一圈", () => {
  const r = compilePlan(mini([
    { id: "hall", type: "building", at: "site.C", size_m: [16, 8, 12] },
    { id: "yard", type: "courtyard", at: "hall.S", size_m: [20, 14], gate: "S" },
    { id: "fence", type: "wall", at: "site.W", path_m: [[0, -20], [0, 0], [10, 10]], size_m: [1, 3, 0.6] },
    { id: "ring_wall", type: "wall", at: "site.N", around: "hall" },
  ]), { seed: 1 });
  const yard = vols(r, "yard");
  assert(yard.filter((v) => v.kind === "wall").length === 5 && yard.some((v) => v.kind === "gate" && v.shape === "arch"), "院：5 段墙（南面断开）+ 门 " + yard.map((v) => v.id));
  assert(r.sid.regions.some((g) => g.plan_id === "yard" && g.kind === "plaza"), "院内铺地");
  assert(vols(r, "fence").length === 2, "折线墙 2 段");
  const rw = vols(r, "ring_wall"), hall = vol(r, "hall");
  assert(rw.length >= 3 && rw.every((v) => !obbOverlap(foot(v), foot(hall))), "围墙绕一圈且不压楼 " + rw.length);
});

// ============================================================ 重复
test("重复 linear / grid：个数、间距、以锚点为中心排开", () => {
  const r = compilePlan(mini([
    { id: "row", type: "repeat", at: "site.C", offset_m: [0, -30], pattern: "linear", count: 5, spacing_m: 10, child: { type: "box", size_m: [4, 4, 4] } },
    { id: "blk", type: "repeat", at: "site.C", offset_m: [0, 20], pattern: "grid", rows: 2, cols: 3, spacing_m: [8, 6], child: { type: "box", size_m: [3, 3, 3] } },
  ]), { seed: 1 });
  const xs = vols(r, "row").map((v) => v.position[0]).sort((a, b) => a - b);
  assert(xs.length === 5 && xs.join() === "-20,-10,0,10,20", "一排 " + xs);
  const g = vols(r, "blk");
  assert(g.length === 6, "网格 6 个");
  assert([...new Set(g.map((v) => v.position[0]))].sort((a, b) => a - b).join() === "-8,0,8" && [...new Set(g.map((v) => v.position[2]))].sort((a, b) => a - b).join() === "17,23", "网格坐标 " + g.map((v) => v.position));
});

test("重复 radial：等角分布在半径上，face center 时门朝圆心，start_deg 0 = 北", () => {
  const r = compilePlan(mini([{ id: "ring", type: "repeat", at: "site.C", pattern: "radial", count: 6, radius_m: 30, face: "center", child: { type: "building", size_m: [6, 8, 6] } }]), { seed: 1 });
  const vs = vols(r, "ring");
  assert(vs.length === 6, "6 个");
  for (const v of vs) { close(dist(xz(v.position), [0, 0]), 30, 0.05, v.id + " 半径"); const f = facing(v), u = [-v.position[0] / 30, -v.position[2] / 30]; assert(f[0] * u[0] + f[1] * u[1] > 0.99, v.id + " 朝圆心"); }
  const first = vs.find((v) => v.instance === 0); close(first.position[0], 0, 0.01, "第 0 个在北"); close(first.position[2], -30, 0.01, "第 0 个在北");
});

test("重复 along：沿连接等距排，模板偏移 [8, 0] 在路右侧 8 m；face path 朝路", () => {
  const r = compilePlan(mini([
    { id: "road", type: "link", style: "road", from: "site.W", to: "site.E" },
    { id: "lamps", type: "repeat", pattern: "along", along: "road", count: 6, face: "path", child: { type: "statue", size_m: [1, 3, 1], offset_m: [8, 0] } },
  ]), { seed: 1 });
  const line = r.sid.paths.find((p) => p.plan_id === "road").points, vs = vols(r, "lamps");
  assert(vs.length === 6, "6 个");
  for (const v of vs) { between(distToPolyline(xz(v.position), line), 7, 9, v.id + " 离路"); assert(v.position[2] > 0, v.id + " 在路右侧（向东走，右手是南）"); const f = facing(v); assert(f[1] < -0.9, v.id + " 朝路"); }
});

test("重复 scatter：在 area 里撒 count 个、互相间隔 ≥ gap、避开已有形体；散在湖里只取水面下的点", () => {
  const r = compilePlan(mini([
    { id: "keep", type: "building", at: "site.C", size_m: [20, 8, 20] },
    { id: "stones", type: "repeat", pattern: "scatter", count: 12, area: "site", gap_m: 8, child: { type: "rock", size_m: [3, 2, 3] } },
  ]), { seed: 3 });
  const vs = vols(r, "stones");
  assert(vs.length === 12, "12 个 " + vs.length);
  for (let i = 0; i < vs.length; i++) { assert(!obbOverlap(foot(vs[i]), foot(vol(r, "keep"))), "不压楼"); for (let j = i + 1; j < vs.length; j++) assert(dist(xz(vs[i].position), xz(vs[j].position)) >= 8 - 1e-6, "间隔"); }
  const L = compilePlan({ name: "湖", site: { size_m: [160, 160], ground: "lake" }, terrain: [{ id: "isle", op: "raise", at: "site.C", size_m: [30, 30], height_m: 8, edge: "cliff" }], nodes: [{ id: "reefs", type: "repeat", pattern: "scatter", count: 8, area: "lake", child: { type: "rock", size_m: [4, 6, 4] } }] }, { seed: 2 });
  const T = L.T;
  for (const v of vols(L, "reefs")) assert(T.heightAt(v.position[0], v.position[2]) < -0.5, v.id + " 在水里 " + T.heightAt(v.position[0], v.position[2]));
});

test("重复 mirror / stack：镜像得两个对称实例；叠层每层立在上一层顶上、按 taper 收分", () => {
  const r = compilePlan(mini([
    { id: "pair", type: "repeat", at: "site.C", offset_m: [0, 30], pattern: "mirror", axis: "x", child: { type: "prism", sides: 4, size_m: [2, 12], offset_m: [10, 0] } },
    { id: "zig", type: "repeat", at: "site.C", offset_m: [0, -20], pattern: "stack", levels: 4, taper: 0.1, child: { type: "box", size_m: [20, 3, 20] } },
  ]), { seed: 1 });
  const p = vols(r, "pair").map((v) => v.position[0]).sort((a, b) => a - b);
  assert(p.join() === "-10,10", "镜像 " + p);
  const z = vols(r, "zig").sort((a, b) => a.instance - b.instance);
  assert(z.length === 4, "4 层");
  for (let k = 1; k < 4; k++) { close(z[k].position[1], z[k - 1].position[1] + z[k - 1].size[1], 0.01, `第 ${k} 层立在上一层上`); close(z[k].size[0], 20 * Math.pow(0.9, k), 0.02, `第 ${k} 层收分`); assert(z[k].rests_on === z[k - 1].id, "rests_on"); }
});

test("skip / overrides：删掉的实例不出，改过的实例尺寸不同；嵌套重复（模板本身是重复）也展开", () => {
  const plan = mini([
    { id: "row", type: "repeat", at: "site.C", pattern: "linear", count: 4, spacing_m: 12, skip: [1], overrides: { "2": { size_m: [6, 20, 6] } }, child: { type: "building", size_m: [6, 6, 6] } },
    { id: "posts", type: "repeat", at: "site.N", pattern: "linear", count: 3, spacing_m: 10, child: { id: "post", type: "repeat", pattern: "stack", levels: 3, child: { type: "box", size_m: [2, 2, 2] } } },
  ]);
  const r = compilePlan(plan, { seed: 1 });
  const rv = vols(r, "row");
  assert(rv.length === 3 && !rv.some((v) => v.instance === 1), "skip 1");
  assert(rv.find((v) => v.instance === 2).size[1] === 20 && rv.find((v) => v.instance === 0).size[1] === 6, "override 2 的高度");
  assert(vols(r, "posts").length === 9, "3 × 3 嵌套 " + vols(r, "posts").length);
  const ex = expand(plan);
  assert(ex.filter((e) => e.instance_of === "row").length === 3 && ex.some((e) => e.id === "row[2]") && !ex.some((e) => e.id === "row[1]"), "expand 扣掉 skip");
});

// ============================================================ 锚点
test("锚点：site.N 在北边（往里收）；X.top 立在 X 顶上（rests_on）；X.S 贴在 X 南外侧不重叠；id[k] 指第 k 个实例", () => {
  const r = compilePlan(mini([
    { id: "hall", type: "building", at: "site.C", size_m: [20, 10, 14] },
    { id: "spire", type: "cone", at: "hall.top", size_m: [4, 8] },
    { id: "porch", type: "box", at: "hall.S", size_m: [8, 3, 6] },
    { id: "north", type: "box", at: "site.N", size_m: [4, 4, 4] },
    { id: "ring", type: "repeat", at: "site.C", offset_m: [0, 40], pattern: "radial", count: 4, radius_m: 12, child: { type: "column", size_m: [2, 6] } },
    { id: "cap", type: "sphere", at: "ring[2].top", size_m: [2] },
  ]), { seed: 1 });
  const hall = vol(r, "hall"), spire = vol(r, "spire"), porch = vol(r, "porch"), north = vol(r, "north");
  close(north.position[0], 0, 0.01, "北 x"); between(north.position[2], -60, -50, "北 z");
  close(spire.position[1], hall.position[1] + hall.size[1], 0.01, "尖顶在殿顶"); assert(spire.rests_on === "hall", "rests_on hall");
  assert(porch.position[2] > hall.position[2] + 7 && !obbOverlap(foot(porch), foot(hall)), "门廊在南外侧不重叠 " + porch.position);
  const c2 = vols(r, "ring").find((v) => v.instance === 2), cap = vol(r, "cap");
  close(cap.position[0], c2.position[0], 0.01, "立在第 2 根柱子上"); close(cap.position[2], c2.position[2], 0.01, "z"); close(cap.position[1], c2.position[1] + c2.size[1], 0.01, "柱顶");
});

test("锚点出错：不存在 → 提示并放到场地中心；互相锚成环 → 断开、提示、照样编译；全局坐标字段被丢掉", () => {
  const r = compilePlan(mini([
    { id: "a", type: "box", at: "b", size_m: [4, 4, 4] },
    { id: "b", type: "box", at: "a", size_m: [4, 4, 4] },
    { id: "lost", type: "box", at: "nope.top", size_m: [3, 3, 3] },
    { id: "cheat", type: "box", at: "site.C", position: [30, 0, 30], x: 30, size_m: [3, 3, 3] },
  ]), { seed: 1 });
  assert(r.warnings.some((w) => w.includes("成环")), "成环提示：" + r.warnings);
  assert(r.warnings.some((w) => w.includes("nope")) && vol(r, "lost"), "不存在的锚点：" + r.warnings);
  assert(r.warnings.some((w) => w.includes("坐标")) && !("position" in findNode(r.plan, "cheat").node), "坐标被丢：" + r.warnings);
  assert(errs(r).length === 0 && vol(r, "a") && vol(r, "b"), "照样编译");
});

test("地形操作只能锚到场地与前面的地形操作：锚到节点 / 后面的操作 → 改到场地中心并提示", () => {

test("雕刻 terrace / raise 的 terraced 边：台阶化后高度是级高的整数倍，各级登记成台地", () => {
  const r = compilePlan({ name: "梯", site: { size_m: [180, 180], ground: "mountain", relief_m: 24 }, terrain: [{ id: "steps", op: "terrace", at: "site.C", size_m: [120, 120], step_h_m: 4 }], nodes: [] }, { seed: 1 });
  const T = r.T;
  const G = T.grid; let n = 0, ok = 0;
  for (let j = 0; j < G.nz; j++) for (let i = 0; i < G.nx; i++) { const x = G.xmin + i * G.res, z = G.zmin + j * G.res; if (Math.hypot(x, z) > 55) continue; const h = G.h[j * G.nx + i]; n++; if (Math.abs(h / 4 - Math.round(h / 4)) < 0.05) ok++; }
  assert(ok === n && n > 1000, `格点里 ${ok} / ${n} 是 4 的倍数`);
  assert(T.terraces.filter((t) => t.plan_id === "steps").length >= 4, "登记了 ≥ 4 级 " + T.terraces.filter((t) => t.plan_id === "steps").length);
  const z = compilePlan(mini([], { terrain: [{ id: "zig", op: "raise", at: "site.C", size_m: [30, 30], height_m: 12, edge: "terraced", steps: 3 }] }), { seed: 1 });
  assert(z.T.terraces.filter((t) => t.plan_id === "zig").length >= 3, "台阶边登记 ≥ 3 级 " + z.T.terraces.filter((t) => t.plan_id === "zig").map((t) => t.height));
});

test("雕刻 ramp / carve / lake / river / dune / noise：坡道单调、沟比两边低、湖有水面且湖底在水下、河出水线、起伏有界", () => {
  const r = compilePlan(mini([], { site: { size_m: [200, 200], ground: "flat" }, terrain: [
    { id: "mesa", op: "raise", at: "site.E", size_m: [30, 60], shape: "rect", height_m: 10, edge: "cliff" },
    { id: "slope", op: "ramp", from: "site.C", to: "mesa.W", width_m: 8 },
    { id: "ditch", op: "carve", from: "site.NW", to: "site.N", width_m: 6, depth_m: 3 },
    { id: "pond", op: "lake", at: "site.SW", size_m: [40, 30], depth_m: 3 },
    { id: "brook", op: "river", from: "site.S", to: "site.SE", width_m: 6, depth_m: 2 },
  ] }), { seed: 1 });
  const T = r.T, ramp = r.sid.terrain.features.find((f) => f.id === "slope");
  const a = ramp.ramp.a, b = ramp.ramp.b; let prev = -Infinity;
  for (let k = 1; k <= 9; k++) { const t = k / 10, h = T.heightAt(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t); assert(h >= prev - 0.05, "坡道单调"); prev = h; }
  assert(prev > 6, "坡道上到台 " + prev);
  const mid = [(-80 + 0) / 2, -80]; assert(T.heightAt(mid[0], mid[1]) < -2.5, "沟底 " + T.heightAt(mid[0], mid[1]));
  const lake = r.sid.regions.find((g) => g.plan_id === "pond" && g.kind === "water"); assert(lake && Number.isFinite(lake.surface_y), "湖有水面");
  const lc = [-80, 80]; assert(T.heightAt(lc[0], lc[1]) < lake.surface_y - 2, "湖底在水下");
  assert(r.sid.paths.some((p) => p.plan_id === "brook" && p.kind === "river" && p.points.length >= 4), "河的水线");
  const d = compilePlan(mini([], { terrain: [{ id: "dunes", op: "dune", amplitude_m: 3, scale_m: 25 }, { id: "bumps", op: "noise", amplitude_m: 1, scale_m: 20 }] }), { seed: 1 });
  let lo = Infinity, hi = -Infinity; for (const h of d.T.grid.h) { lo = Math.min(lo, h); hi = Math.max(hi, h); }
  assert(lo >= -1.1 && hi <= 4.1 && hi - lo > 1.5, `起伏 ${lo}..${hi}`);
});

test("空心圆柱 = 环带：hollow + wall_m 进 SID（hollow / wall），落地按带子上最高点、离地量带子下面，孔里能放东西不算撞", () => {
  const r = compilePlan(pitRings(), { seed: 1 });
  assert(!errs(r).length, JSON.stringify(errs(r)));
  const [a, b, c] = ["r1", "r2", "r3"].map((id) => vol(r, id));
  assert(a.hollow && a.wall === 6 && b.wall === 6 && c.shape === "cylinder", JSON.stringify([a.hollow, a.wall, b.wall]));
  // 一圈比一圈低（坑壁台阶化），每圈都不悬空（离地按带子下面量，不按坑底中心）
  assert(a.position[1] > b.position[1] + 1 && b.position[1] > c.position[1] + 1, "高度 " + [a, b, c].map((v) => v.position[1]));
  assert([a, b, c].every((v) => v.elev < 1), "离地 " + [a, b, c].map((v) => v.elev));

  assert(!r.facts.plan.overlaps.length, "重叠 " + JSON.stringify(r.facts.plan.overlaps));
  assert(!r.facts.plan.pushed.some((p) => p.id === "lamp" || p.id === "stalls"), "推了 " + JSON.stringify(r.facts.plan.pushed));
  const lamp = vol(r, "lamp");
  assert(dist(xz(lamp.position), [0, 0]) < 0.5, "灯柱还在坑心 " + lamp.position);
  // 基座（如果有）也是一圈，中间不填实
  for (const pv of r.sid.volumes.filter((v) => v.plinth_of && ["r1", "r2", "r3"].includes(v.plinth_of))) assert(pv.hollow && pv.wall > 0, "基座空心 " + pv.id);
  // 方的东西压在带子上要推开（推到孔里或环外）
  const p2 = pitRings(); p2.nodes.push({ id: "kiosk", type: "box", label: "售票亭", at: "pit", offset_m: [0, 57.4], size_m: [4, 3, 4] });
  const r2 = compilePlan(p2, { seed: 1 }), k = vol(r2, "kiosk"), d = dist(xz(k.position), [0, 0]);
  assert(r2.facts.plan.pushed.some((p) => p.id === "kiosk") && d >= 58 && d < 60, "售票亭推到环外 " + d);
  const p3 = pitRings(); p3.nodes.push({ id: "kiosk", type: "box", label: "售票亭", at: "pit", offset_m: [0, 53], size_m: [4, 3, 4] });
  assert(compilePlan(p3, { seed: 1 }).facts.plan.overlaps.some((o) => o.id === "kiosk" && o.b === "r1"), "整个压在带子上（推不开）就报告");
});

test("线形地形的方位锚点 = 岸：斜沟的 .SW / .NE、.left / .right 落在沟两侧；锚在 .mid 的方块顺着沟转；桥长 ≥ 沟宽；两端重合的连接进检查", () => {
  const p = mini([
    { id: "west_wall", type: "group", label: "西岸", at: "trench.SW", children: [{ type: "box", label: "西摊", size_m: [3, 2, 3] }] },

    { id: "br", type: "link", style: "bridge", label: "铁桥", from: "west_wall", to: "east_wall", width_m: 2 },
    { id: "br2", type: "link", style: "bridge", label: "左右桥", from: "trench.left", to: "trench.right", width_m: 2 },
    { id: "dead", type: "link", style: "ramp", label: "原地坡", from: "trench.S", to: "trench.S", width_m: 3 },
  ], { terrain: [
    { op: "carve", id: "trench", label: "施工沟", from: "site.NW", to: "site.SE", width_m: 6, depth_m: 4, edge: "terraced", steps: 3 },
    { op: "lower", id: "wet", label: "沟底积水", at: "trench.mid", shape: "rect", size_m: [6, 60], depth_m: 0.35 },
  ] });
  const r = compilePlan(p, { seed: 1 });
  const tr = r.sid.terrain.features.find((f) => f.id === "trench"), L = tr.line;
  const side = (q) => { const a = L[0], b = L[L.length - 1]; return (b[0] - a[0]) * (q[1] - a[1]) - (b[1] - a[1]) * (q[0] - a[0]); };
  const w = xz(vols(r, "west_wall")[0].position), e = xz(vols(r, "east_wall")[0].position);
  assert(side(w) * side(e) < 0, "两岸在沟两侧 " + w + " / " + e);
  assert(w[0] < 0 && w[1] > 0 && e[0] > 0 && e[1] < 0, "西岸在西南、东岸在东北 " + w + " / " + e);
  for (const q of [w, e]) assert(distToPolyline(q, L) >= 3 + 1.5, "离沟中线 ≥ 半宽 + 1.5 m " + distToPolyline(q, L));
  const P = (id) => r.sid.paths.find((q) => q.plan_id === id);
  for (const id of ["br", "br2"]) { const b = P(id), len = dist(b.points[0], b.points[b.points.length - 1]); assert(len >= 6, `${id} 桥长 ${len} ≥ 沟宽 6`); assert(side(b.points[0]) * side(b.points[b.points.length - 1]) < 0, id + " 跨过沟"); }
  const wet = r.sid.terrain.features.find((f) => f.id === "wet"), pg = wet.polygon;
  let far = null; for (const a of pg) for (const b of pg) if (!far || dist(a, b) > dist(far[0], far[1])) far = [a, b];
  const dv = [far[1][0] - far[0][0], far[1][1] - far[0][1]], dl = [L[L.length - 1][0] - L[0][0], L[L.length - 1][1] - L[0][1]];
  const cos = Math.abs(dv[0] * dl[0] + dv[1] * dl[1]) / Math.hypot(...dv) / Math.hypot(...dl);
  assert(cos > 0.95, "积水长边顺着沟 cos=" + cos.toFixed(3) + " " + JSON.stringify(pg));
  const c = chk(r, "links_routed");
  assert(c && !c.ok && /原地坡/.test(c.detail) && /锚点重合/.test(c.detail) && /两岸/.test(c.detail) && !/铁桥|左右桥/.test(c.detail), c && c.detail);
});

test("环孔里的方块四角伸进环带：报伸进去的深度（不是一整圈的推距），修法是缩到内径以内", () => {
  const p = mini([
    { id: "ring_wall", type: "cylinder", label: "环墙", at: "site.C", size_m: [96, 22], hollow: true, wall_m: 6 },
    { id: "floor", type: "platform", label: "院地", at: "site.C", size_m: [70, 0.5, 70] },
  ]);
  const r = compilePlan(p, { seed: 1 }), c = chk(r, "shapes_no_overlap");
  assert(c && !c.ok && /伸进环带 7\.\d m/.test(c.detail) && /缩到内径/.test(c.detail), c && c.detail);
  const f = c.fixes.find((x) => x.ops && x.ops[0].field === "size_m");
  assert(f && f.ops[0].id === "floor" && Math.hypot(f.ops[0].value[0], f.ops[0].value[2]) / 2 < 42, JSON.stringify(c.fixes));
});
run();
</script>
