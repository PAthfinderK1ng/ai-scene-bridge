<!doctype html><meta charset="utf-8"><pre id="out">running</pre>
<script type="module">
// eval_cards.test.html — D17「首次理解准确率」评测的几何环节：只读 build/eval/cards.json（由 tools/eval_first_interpretation.py 生成），
// 对每个输入的三张卡用 engine/sid.js 的 applyCard + resolve 算几何，用 diversity.signature / distinctEnough 判三张是否够不同。
// 输出遵守 harness 约定（PASS / FAIL 行 + DONE），另加一行 "DATA <json>" 给脚本解析。不改引擎，不写坐标。
import { newDoc, applyCard, resolve } from "../sid.js";
import { signature, distinctEnough, distance } from "../diversity.js";

const out = document.getElementById("out");
const lines = [], data = [];
let pass = 0, fail = 0;
const r1 = (v) => (Number.isFinite(v) ? Math.round(v * 10) / 10 : null);

try {
  const res = await fetch("../../../build/eval/cards.json", { cache: "no-store" });
  if (!res.ok) throw new Error(`读不到 build/eval/cards.json（HTTP ${res.status}）：先跑 python -X utf8 tools/eval_first_interpretation.py`);
  const j = await res.json();
  for (const inp of j.inputs || []) {
    const cards = inp.cards || [];
    const row = { id: inp.id, text: inp.text, distinct: null, pairwise: [], cards: [] };
    if (cards.length !== 3) {
      fail++; lines.push(`FAIL ${inp.id} ${inp.text}: 卡片数 ${cards.length}（${inp.error || "无"}）`); row.error = inp.error || `卡片数 ${cards.length}`; data.push(row); continue;
    }
    try {
      const rs = cards.map((c) => resolve(applyCard(newDoc(), Object.assign({}, c, { seed: 1 })), { seed: 1 }));
      const sigs = rs.map((r) => signature(r.sid));
      row.distinct = distinctEnough(sigs);
      row.pairwise = [[0, 1], [0, 2], [1, 2]].map(([a, b]) => Math.round(distance(sigs[a], sigs[b]) * 100) / 100);
      row.cards = rs.map((r, k) => {
        const chk = Object.fromEntries(r.checks.map((c) => [c.id, c.ok]));
        const lm = r.sid.volumes.find((v) => v.importance === "landmark");
        const lmTerrace = lm ? r.T.terraceAt(lm.position[0], lm.position[2]) : null;
        return {
          houses: r.facts.houses, trees: r.facts.trees, terraces: r.facts.terraces, has_stream: !!r.facts.has_stream,
          checks_ok: r.facts.checks_ok, checks_total: r.facts.checks_total, errors: r.facts.errors, checks: chk,
          landmark_level: lmTerrace ? lmTerrace.level + 1 : null,
          trail_len_m: r.facts.trail ? r1(r.facts.trail.length_m) : null, trail_fallback: r.facts.trail ? r.facts.trail.fallback : null,
          top_height_m: r1(Math.max(0, ...r.sid.terrain.features.map((f) => f.height || 0))),
        };
      });
      const ok = row.cards.every((c) => c.errors === 0);
      ok ? pass++ : fail++;
      lines.push(`${ok ? "PASS" : "FAIL"} ${inp.id} ${inp.text}: houses=${row.cards.map((c) => c.houses).join("/")} checks_ok=${row.cards.map((c) => `${c.checks_ok}/${c.checks_total}`).join(" ")} distinct=${row.distinct}` + (ok ? "" : ` errors=${row.cards.map((c) => c.errors).join("/")}`));
    } catch (e) {
      fail++; row.error = String(e && e.message || e); lines.push(`FAIL ${inp.id} ${inp.text}: ${row.error}`);
    }
    data.push(row);
  }
} catch (e) {
  fail++; lines.push("FAIL eval_cards: " + (e && e.message || e));
}
lines.push("DATA " + JSON.stringify(data));
lines.push(`DONE passed=${pass} failed=${fail}`);
out.textContent = lines.join("\n");
</script>
